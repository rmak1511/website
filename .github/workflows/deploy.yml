name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        # SPA fallback: Pages serves 404.html for unknown paths, so a
        # copy of the app shell there lets the client router resolve
        # deep links like /rentals.
      - run: cp dist/index.html dist/404.html
        # Real per-page copies so /rentals, /services and /about answer
        # 200 (not the 404 fallback) and can be indexed.
      - run: for p in rentals services about; do mkdir -p dist/$p && cp dist/index.html dist/$p/index.html; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
